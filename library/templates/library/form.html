{% extends "library/base.html" %}
{% block content %}
<h1>{{ heading }}</h1>
{% if intro %}<p class="muted">{{ intro }}</p>{% endif %}
<form method="post" class="form"{% if multipart %} enctype="multipart/form-data"{% endif %}>
  {% csrf_token %}
  {{ form.as_div }}
  <div class="actions">
    <button class="btn primary" type="submit">{{ submit_label|default:"Save" }}</button>
    <a class="btn" href="{{ cancel_url|default:'/' }}">Cancel</a>
  </div>
</form>
{% endblock %}
