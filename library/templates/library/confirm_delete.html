{% extends "library/base.html" %}
{% block content %}
<h1>Delete "{{ object }}"?</h1>
<p>This also removes all related chapters and typing results. It can't be undone.</p>
<form method="post">
  {% csrf_token %}
  <div class="actions">
    <button class="btn danger" type="submit">Yes, delete</button>
    <a class="btn" href="{{ cancel_url }}">Cancel</a>
  </div>
</form>
{% endblock %}
